<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie – IT Tools Wilga</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card card shadow-lg">
      <div class="login-header text-center">
        <div class="login-logo mb-3">
          <i class="bi bi-pc-display-horizontal display-4 text-white"></i>
        </div>
        <h4 class="fw-bold text-white mb-0">IT Tools Wilga</h4>
        <small class="text-white-50">Brueggen Polska Sp. z o.o.</small>
      </div>
      <div class="card-body p-4">
        <h5 class="mb-4 text-center text-muted">Zaloguj się</h5>
        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
        </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nazwa użytkownika</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control form-control-lg"
                     placeholder="login" autofocus autocomplete="username" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Hasło</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control form-control-lg"
                     placeholder="••••••••" autocomplete="current-password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Zaloguj się
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
